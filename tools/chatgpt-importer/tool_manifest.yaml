name: athena-chatgpt-importer

version: "0.1"

description: >
  Import ChatGPT conversation exports
  into Athena Knowledge Packages.

akp_versions:
  - "1.0"

permissions:
  network: false
  filesystem:
    read: true
    write: true

capabilities:
  - conversation_import
  - ai_archive_import

inputs:
  - chatgpt_export

outputs:
  - akp
