name: athena-deepseek-importer

version: "0.1"

description: >
  Import DeepSeek conversation exports
  and convert them into Athena Knowledge Packages.

akp_versions:
  - "1.0"

permissions:
  network: false
  filesystem:
    read: true
    write: true

capabilities:
  - conversation_import
  - ai_archive_import

inputs:
  - deepseek_export

outputs:
  - akp
